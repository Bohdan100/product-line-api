<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title th:text="${line.name}"></title>

</head>
<body>
<div th:insert="~{fragment/navbar :: navbar}"></div>
<div id="content" class="container-fluid">

    <h2 align="center" th:text="${line.name}"></h2>

    <div th:insert="~{fragment/filter :: filter}"></div>

    <a class="btn btn-primary mb-3" th:href="@{/lines/line/{id}/record-create(id=${line.id})}">Add record</a>

    <div th:insert="~{fragment/table :: table (${line},${page})}"></div>
</div>
</body>
</html>
