<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Create user</title>
</head>
<body>
<div th:insert="~{fragment/navbar :: navbar}"></div>
<div id="content" class="container-fluid">

    <form action="#" th:action="@{/users/create}" th:object="${user}" method="post">
        <div class="form-row">
            <label for="username">Username</label>
            <input class="form-control" type="text" th:field="*{username}" id="username" placeholder="Username">
            <div class="form-group col-md-4">
                <p th:if="${#fields.hasErrors('username')}" class="alert alert-danger" th:errors="*{username}"></p>
            </div>
        </div>
        <div class="form-row">
            <label for="password">Password</label>
            <input class="form-control" type="text" th:field="*{password}" id="password" placeholder="Password">
            <div class="form-group col-md-4">
                <p th:if="${#fields.hasErrors('password')}" class="alert alert-danger" th:errors="*{password}"></p>
            </div>
        </div>
        <div class="form-row">
            <label for="name">Name</label>
            <input class="form-control" type="text" th:field="*{name}" id="name" placeholder="Name">
            <div class="form-group col-md-4">
                <p th:if="${#fields.hasErrors('name')}" class="alert alert-danger" th:errors="*{name}"></p>
            </div>
        </div>
        <div class="form-row">
            <label for="surname">Surname</label>
            <input class="form-control" type="text" th:field="*{surname}" id="surname" placeholder="Surname">
            <div class="form-group col-md-4">
                <p th:if="${#fields.hasErrors('surname')}" class="alert alert-danger" th:errors="*{surname}"></p>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-4">
                <label for="role">Roles:</label>
                <span th:each="role : ${allRoles}">
                    <label class="ml-4" for="role" th:text="${role}"></label>
                    <input type="checkbox" id="role" th:name="roles" th:value="${role}" />
                </span>
            </div>
        </div>
        <div class="form-group col-md-4">
            <p th:if="${#fields.hasErrors('roles')}" class="alert alert-danger" th:errors="*{roles}"></p>
        </div>
        <button class="btn btn-primary" type="submit" value="Create user">Create</button>
    </form>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        form.addEventListener("submit", function (event) {
            const checkboxes = document.querySelectorAll('input[type="checkbox"][name="roles"]');
            const isChecked = Array.from(checkboxes).some(cb => cb.checked);
            if (!isChecked) {
                event.preventDefault();
                alert("Выберите хотя бы одну роль!");
            }
        });
    });
</script>
</body>
</html>
