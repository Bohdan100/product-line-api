spring:
  application:
    name: product-line-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product}
    username: ${SPRING_DATASOURCE_USERNAME:product_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:secret1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  web:
    resources:
      add-mappings: true

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  # SQL debug and logging
  file:
    name: logs/application.log

server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m
  tomcat:
    basedir: .
    accesslog:
      enabled: true
      directory: logs
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For