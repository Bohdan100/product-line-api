services:
  db:
    image: postgres:17-alpine
    container_name: product-line-db
    restart: always
    environment:
      POSTGRES_DB: product
      POSTGRES_USER: product_admin
      POSTGRES_PASSWORD: secret1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_admin -d product"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - product-line-net

  app:
    build: .
    container_name: product-line-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/product
      - SPRING_DATASOURCE_USERNAME=product_admin
      - SPRING_DATASOURCE_PASSWORD=secret1234
      - DB_USERNAME=product_admin
      - DB_PASSWORD=secret1234
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - product-line-net

networks:
  product-line-net:
    driver: bridge

volumes:
  postgres_data: